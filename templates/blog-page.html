{% extends "base.html" %}
{% block title %}{{ page.title }} — {{ config.title }}{% endblock title %}
{% block content %}
<article class="prose">
  <h1>{{ page.title }}</h1>
  <p class="meta">{{ page.date | date(format="%B %-d, %Y") }}</p>
  {{ page.content | safe }}
</article>
{% endblock content %}
