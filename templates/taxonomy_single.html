{% extends "base.html" %} {% block title %}{{ term.name }} — {{ config.title
}}{% endblock title %} {% block content %}
<h1>Tag: {{ term.name }}</h1>
<div class="card-grid">
  {% for page in term.pages %}
  <a class="card" href="{{ page.permalink }}">
    <h2>{{ page.title }}</h2>
    {% if page.extra.summary %}
    <p>{{ page.extra.summary }}</p>
    {% endif %}
  </a>
  {% endfor %}
</div>
{% endblock content %}
